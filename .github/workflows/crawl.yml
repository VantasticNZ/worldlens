name: WorldLens Automated Crawler

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to crawl'
        required: true
        default: 'politicians'
        type: choice
        options:
          - all
          - politicians
          - companies
          - countries

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - show file structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== crawler folder ==="
          ls -la crawler/ || echo "NO CRAWLER FOLDER"
          echo "=== Working dir ==="
          pwd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run crawler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CRAWL_SCOPE: ${{ github.event.inputs.scope || 'politicians' }}
        run: |
          python crawler/crawl.py

      - name: Commit data
        run: |
          git config user.email "bot@worldlens"
          git config user.name "WorldLens Bot"
          git add live_data/
          git diff --staged --quiet || git commit -m "🤖 crawl update [skip ci]"
          git push
