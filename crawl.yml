name: WorldLens Automated Crawler

on:
  schedule:
    - cron: '0 17,5,23,11 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to crawl'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - politicians
          - companies
          - countries
      dry_run:
        description: 'Dry run'
        required: false
        default: 'false'
        type: boolean
  push:
    paths:
      - 'crawler/**'
    branches:
      - main

jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: crawler
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests
      - name: Determine crawl scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.scope }}" >> $GITHUB_OUTPUT
          else
            DOW=$(date +%u)
            case $DOW in
              1|4) echo "scope=politicians" >> $GITHUB_OUTPUT ;;
              2|5) echo "scope=companies" >> $GITHUB_OUTPUT ;;
              3|6) echo "scope=countries" >> $GITHUB_OUTPUT ;;
              7)   echo "scope=all" >> $GITHUB_OUTPUT ;;
              *)   echo "scope=politicians" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Run crawler
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CRAWL_SCOPE: ${{ steps.scope.outputs.scope }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python crawler/crawl.py 2>&1 | tee crawler_output.log
      - name: Upload crawler log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawler-log-${{ github.run_number }}
          path: crawler_output.log
          retention-days: 14
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet live_data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit live data
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "worldlens-bot@users.noreply.github.com"
          git config --local user.name "WorldLens Crawler Bot"
          git add live_data/
          git commit -m "🤖 Auto-crawl: ${{ steps.scope.outputs.scope }} [skip ci]"
          git push
      - name: Job summary
        if: always()
        run: |
          echo "## WorldLens Crawler Run" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** ${{ steps.scope.outputs.scope }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changed:** ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          tail -30 crawler_output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No log"
